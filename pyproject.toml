[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vey"
version = "2.0.0-rc1"
description = "A machine-native decision runtime: fast, typed decisions without autoregressive generation, plus the CRUX semantic decision engine (frozen NLI grounding + a deterministic executor)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.20",
  "torch>=2.0",
  "transformers>=4.48",
  "safetensors>=0.4",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
parity = ["laya==0.3.20", "rank_bm25"]
demo = ["rich>=13"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
