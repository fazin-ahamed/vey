name: Feature request
description: Suggest a new capability or an extension to an existing lane.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: dropdown
    id: lane
    attributes:
      label: Which lane?
      options: [structured, semantic, retrieval, long context, act, trust, other]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including simpler approaches.
